<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot "C:/Users/USER/Desktop/Luma_Finanzas_Reto2/Luma_Finanzas_Reto2/produccion"

    <Directory "C:/Users/USER/Desktop/Luma_Finanzas_Reto2/Luma_Finanzas_Reto2/produccion">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    ErrorLog "logs/luma-error.log"
    CustomLog "logs/luma-access.log" combined
</VirtualHost>
